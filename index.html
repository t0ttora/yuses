<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="icon" type="image/png" href="/workspaces/yuses/favice.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BEYİN'26 Zirvesi - Saf Sahne Modu</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        /* Performans iyileştirmesi: Animasyonları GPU'ya taşır */
        .neural-node, .zap-line { will-change: transform, opacity; }
        
        /* Input focus titremesini önler */
        input:focus { outline: none; }
        
        /* Kaydırma çubuğunu gizle */
        ::-webkit-scrollbar { display: none; }
        
        @keyframes node-pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.6); opacity: 0.7; }
        }
        @keyframes synapse-fire {
            0%, 100% { filter: brightness(1); opacity: 0.8; }
            50% { filter: brightness(2.5); opacity: 1; }
        }
        @keyframes zap {
            0% { transform: scaleX(0); opacity: 1; }
            100% { transform: scaleX(1); opacity: 0; }
        }
        @keyframes insight-reveal {
            0% { transform: scale(0.6) translateY(50px); opacity: 0; filter: blur(20px); }
            100% { transform: scale(1) translateY(0); opacity: 1; filter: blur(0px); }
        }
        @keyframes neuron-explode {
            0% { transform: translate(0, 0) scale(0); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(var(--s)); opacity: 0; }
        }
        
        /* Metin kutusu numaralarındaki okları kaldır */
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-[#05050a] overflow-hidden m-0 p-0 font-sans text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, memo } = React;

        // ARKA PLAN (Memo ile sabitlendi - Titremeyi önler)
        const BrainBackground = memo(({ isScanning }) => {
            const nodes = useMemo(() => 
                Array.from({ length: 80 }, (_, i) => ({
                    id: i, left: Math.random() * 100, top: Math.random() * 100,
                    size: Math.random() * 5 + 3, isGold: Math.random() > 0.5,
                    delay: Math.random() * 3, duration: Math.random() * 4 + 2
                })), []);

            return (
                <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden">
                    <div className="absolute inset-0 bg-gradient-to-br from-[#0b0914] via-[#05050a] to-[#1a0f00]"></div>
                    <div className="absolute inset-0 bg-[radial-gradient(circle_at_85%_50%,_rgba(251,191,36,0.12),_transparent_60%)]"></div>

                    {nodes.map(n => (
                        <div key={n.id} className="absolute" style={{ left: n.left+'%', top: n.top+'%' }}>
                            <div className={`neural-node rounded-full transition-all ${isScanning ? 'animate-[synapse-fire_0.15s_linear_infinite] scale-150' : 'animate-[node-pulse_linear_infinite]'}`}
                                style={{ 
                                    width: n.size+'px', height: n.size+'px',
                                    backgroundColor: n.isGold ? '#fbbf24' : '#818cf8',
                                    boxShadow: `0 0 15px ${n.isGold ? '#fbbf24' : '#818cf8'}`,
                                    animationDelay: isScanning ? '0s' : n.delay+'s',
                                    animationDuration: isScanning ? '0.15s' : n.duration+'s'
                                }}
                            />
                            {isScanning && Math.random() > 0.7 && (
                                <div className="zap-line absolute top-0 left-0 h-[1px] origin-left animate-[zap_0.1s_ease-out_forwards]"
                                     style={{ 
                                         width: Math.random() * 200 + 100 + 'px',
                                         background: n.isGold ? 'linear-gradient(to right,#fbbf24,transparent)' : 'linear-gradient(to right,#818cf8,transparent)',
                                         transform: `rotate(${Math.random() * 360}deg)` 
                                     }} />
                            )}
                        </div>
                    ))}
                </div>
            );
        });

        // KONFETİ PATLAMASI
        const NeuronExplosion = memo(() => {
            const particles = useMemo(() => Array.from({length: 150}, (_, i) => ({
                id: i, tx: (Math.random() - 0.5) * 160 + 'vw', ty: (Math.random() - 0.5) * 160 + 'vh', 
                s: Math.random() * 2 + 1, color: Math.random() > 0.5 ? '#fbbf24' : '#818cf8', delay: Math.random() * 0.1
            })), []);

            return (
                <div className="fixed inset-0 pointer-events-none z-50 flex items-center justify-center">
                    {particles.map(p => (
                        <div key={p.id} className="absolute rounded-full shadow-[0_0_20px_currentColor] animate-[neuron-explode_2.5s_cubic-bezier(0.25,1,0.5,1)_forwards]"
                             style={{ 
                                 '--tx': p.tx, '--ty': p.ty, '--s': p.s, 
                                 backgroundColor: p.color, color: p.color, 
                                 animationDelay: p.delay+'s', width: '7px', height: '7px' 
                             }} />
                    ))}
                </div>
            );
        });

        function App() {
            const [status, setStatus] = useState('setup'); // setup | idle | scanning | insight
            const [participantCount, setParticipantCount] = useState('');
            const [prizeTitle, setPrizeTitle] = useState('');
            const [currentPrize, setCurrentPrize] = useState('BÜYÜK ÖDÜL');
            const [winner, setWinner] = useState(null);
            const [currentMind, setCurrentMind] = useState('');
            const [confetti, setConfetti] = useState(false);
            const items = useRef([]);
            const audioRef = useRef(null);

            // Ses Sentezleyici
            const getCtx = () => {
                if (!audioRef.current) audioRef.current = new (window.AudioContext || window.webkitAudioContext)();
                if (audioRef.current.state === 'suspended') audioRef.current.resume();
                return audioRef.current;
            };

            const playZap = (ctx) => {
                const t=ctx.currentTime, o=ctx.createOscillator(), g=ctx.createGain();
                o.type='sawtooth'; o.frequency.setValueAtTime(300+Math.random()*800, t);
                g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.05, t+0.02); g.gain.exponentialRampToValueAtTime(0.01, t+0.1);
                o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+0.1);
            };

            const playEpiphany = (ctx) => {
                const t=ctx.currentTime;
                [329.63, 415.30, 493.88, 659.25].forEach(freq => {
                    const o=ctx.createOscillator(), g=ctx.createGain();
                    o.type='sine'; o.frequency.setValueAtTime(freq, t);
                    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.3, t+0.1); g.gain.exponentialRampToValueAtTime(0.01, t+3);
                    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+3);
                });
            };

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.target.tagName === 'INPUT') return;
                    if (e.code === 'Space') {
                        e.preventDefault();
                        if (status === 'idle') startScan();
                        else if (status === 'insight') { setStatus('idle'); setWinner(null); setConfetti(false); }
                    } else if (e.code === 'Escape' && status !== 'setup') setStatus('setup');
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [status]);

            const startSetup = () => {
                const count = parseInt(participantCount);
                if (count >= 2) {
                    items.current = Array.from({length: count}, (_, i) => `${i + 1}`);
                    setCurrentPrize(prizeTitle || 'SÜRPRİZ ÖDÜL');
                    setStatus('idle');
                    getCtx();
                }
            };

            const startScan = () => {
                const ctx = getCtx();
                setStatus('scanning');
                const interval = setInterval(() => {
                    setCurrentMind(items.current[Math.floor(Math.random() * items.current.length)]);
                    if (Math.random() > 0.4) playZap(ctx);
                }, 60);

                setTimeout(() => {
                    clearInterval(interval);
                    const win = items.current[Math.floor(Math.random() * items.current.length)];
                    setWinner(win);
                    setStatus('insight');
                    playEpiphany(ctx);
                    setConfetti(true);
                    setTimeout(() => setConfetti(false), 5000);
                }, 4000);
            };

            const toggleFS = () => {
                if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
                else document.exitFullscreen?.();
            };

            return (
                <div className="min-h-screen w-full flex flex-col items-center justify-center relative p-6 select-none overflow-hidden touch-none">
                    <BrainBackground isScanning={status === 'scanning'} />
                    {confetti && <NeuronExplosion />}

                    {/* Tam Ekran Butonu */}
                    <button onClick={toggleFS} className="fixed top-6 right-6 z-50 bg-white/10 backdrop-blur-md border border-white/10 p-3 rounded-xl hover:bg-white/20 transition-all opacity-40 hover:opacity-100">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                    </button>

                    {/* Başlık Bölümü */}
                    <div className="z-20 mb-8 flex flex-col items-center animate-[fadeIn_0.7s_ease-out_forwards]">
                        <h1 className="text-5xl md:text-8xl font-black tracking-tight text-white mb-2 font-orbitron drop-shadow-[0_0_20px_rgba(255,255,255,0.3)]">
                            BEYİN'<span className="text-[#fbbf24]">26</span>
                        </h1>
                        <h2 className="text-2xl md:text-4xl font-bold text-white/90 uppercase tracking-[0.4em]">
                            Kariyer Zirvesi
                        </h2>
                    </div>

                    {/* Ana Panel */}
                    <div className="z-20 w-full max-w-5xl bg-white/[0.03] backdrop-blur-3xl border border-white/10 rounded-[3.5rem] p-12 flex flex-col items-center justify-center shadow-[0_50px_100px_rgba(0,0,0,0.7)] min-h-[420px] relative overflow-hidden">
                        
                        {status === 'setup' && (
                            <div className="flex flex-col items-center w-full">
                                <div className="text-white/30 uppercase tracking-[0.5em] font-black text-xs mb-10">Sistem Kurulumu</div>
                                <div className="flex flex-col md:flex-row gap-5 items-center w-full max-w-2xl">
                                    <input type="number" value={participantCount} onChange={e => setParticipantCount(e.target.value)} placeholder="Sayı" className="w-full md:w-36 bg-black/50 border border-white/20 p-5 rounded-2xl text-white outline-none text-center focus:border-[#fbbf24] transition-colors text-2xl font-bold"/>
                                    <input type="text" value={prizeTitle} onChange={e => setPrizeTitle(e.target.value)} placeholder="Ödül Adı (Örn: Kulaklık)" className="w-full md:flex-1 bg-black/50 border border-white/20 p-5 rounded-2xl text-white outline-none focus:border-[#818cf8] transition-colors text-2xl placeholder-white/10"/>
                                    <button onClick={startSetup} className="w-full md:w-auto bg-[#7a73e6] hover:bg-[#6861cc] text-white px-12 py-5 rounded-2xl font-black text-xl transition-all shadow-lg hover:scale-105 active:scale-95">GİRİŞ</button>
                                </div>
                            </div>
                        )}

                        {status === 'idle' && (
                            <div className="flex flex-col items-center justify-center w-full h-full animate-[fadeIn_0.5s_ease-out_forwards]">
                                <div className="text-[#fbbf24] text-4xl md:text-6xl tracking-[0.3em] font-black mb-12 uppercase text-center drop-shadow-[0_0_25px_#fbbf24] font-orbitron">{currentPrize}</div>
                                <div className="text-white/40 text-2xl md:text-4xl tracking-[0.1em] font-light animate-pulse uppercase text-center">
                                    <span className="font-black text-white/90 border-2 border-white/20 px-6 py-3 rounded-2xl mx-3">SPACE</span> TUŞUNA BASIN
                                </div>
                            </div>
                        )}

                        {status === 'scanning' && (
                            <div className="text-center w-full">
                                <div className="text-[#fbbf24] text-2xl md:text-4xl tracking-[0.4em] font-black mb-8 uppercase drop-shadow-[0_0_15px_#fbbf24]">{currentPrize}</div>
                                <div className="text-white/50 text-sm tracking-[0.5em] font-bold mb-6 uppercase animate-pulse">Sinapslar Taranıyor...</div>
                                <div className="text-[10rem] md:text-[16rem] font-black text-white drop-shadow-[0_0_50px_rgba(255,255,255,0.6)] leading-none font-orbitron">{currentMind}</div>
                            </div>
                        )}

                        {status === 'insight' && (
                            <div className="text-center animate-[insight-reveal_0.7s_cubic-bezier(0.175,0.885,0.32,1.275)_forwards] w-full">
                                <div className="text-[#fbbf24] text-4xl md:text-6xl tracking-[0.2em] font-black mb-12 uppercase drop-shadow-[0_0_25px_#fbbf24] font-orbitron">{currentPrize}</div>
                                <div className="inline-block bg-[#818cf8]/20 border-2 border-[#818cf8]/40 text-[#818cf8] px-12 py-3 rounded-full font-black tracking-[0.3em] text-xl mb-10 uppercase shadow-[0_0_30px_rgba(129,140,248,0.2)]">ŞANSLI KAZANAN</div>
                                <div className="text-[12rem] md:text-[18rem] font-black text-white drop-shadow-[0_0_80px_rgba(255,255,255,0.8)] leading-none font-orbitron">{winner}</div>
                            </div>
                        )}
                    </div>

                    {status !== 'setup' && (
                        <div className="absolute bottom-10 right-12 text-white/10 text-sm tracking-[0.5em] font-bold uppercase font-mono">ESC: Ayarlar</div>
                    )}

                    <style>{`
                        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
                    `}</style>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
